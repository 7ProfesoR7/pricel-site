<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Исходник картинки превью ссылки (og-image.png, 1200×630). Рендер: Edge headless, см. tools/README.md -->
<link rel="stylesheet" href="../docs/assets/css/site.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .og { position: relative; width: 1200px; height: 630px; padding: 64px 72px; display: grid; grid-template-rows: auto 1fr auto; }
  .og::before { content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(45% 70% at 85% 55%, rgba(255,107,0,.28), transparent 70%),
      radial-gradient(circle at 1px 1px, rgba(237,232,225,.06) 1px, transparent 1.4px) 0 0 / 22px 22px; }
  .og > * { position: relative; }
  .og h1 { font-family: var(--f-display); font-weight: 800; font-size: 72px; line-height: 1.04; letter-spacing: -.02em; max-width: 15ch; align-self: center; }
  .og h1 em { font-style: normal; color: var(--flame); }
  .og .row { display: flex; justify-content: space-between; align-items: end; color: var(--ash); font-size: 26px; }
  .og .row b { color: var(--bone); }
  .big-reticle { position: absolute; right: 70px; top: 170px; width: 300px; height: 300px; opacity: .9; }
</style>
</head>
<body>
<div class="og">
  <div class="logo"><svg viewBox="0 0 40 40" style="width:52px;height:52px"><rect width="40" height="40" rx="9" fill="#14120F" stroke="#2E2924"/><circle cx="20" cy="20" r="11" fill="none" stroke="#EDE8E1" stroke-width="2.4"/><path d="M20 4.5v7M20 28.5v7M4.5 20h7M28.5 20h7" fill="none" stroke="#EDE8E1" stroke-width="2.4" stroke-linecap="round"/><circle cx="20" cy="20" r="3" fill="#FF6B00"/></svg><div><b style="font-size:30px">Прицел</b><span style="font-size:17px">ИИ-аналитика</span></div></div>
  <h1>Клиенты, которым обещали <em>замер</em> и забыли</h1>
  <div class="row"><span>Два раза в день список: <b>кому позвонить сегодня</b></span><span class="mono" style="font-size:20px;color:var(--ember)">pricel-ai.ru</span></div>
  <svg class="big-reticle" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="15" fill="none" stroke="#FF6B00" stroke-width="1.2"/><path d="M22 2v9M22 33v9M2 22h9M33 22h9" stroke="#FF6B00" stroke-width="1.2" stroke-linecap="round"/><circle cx="22" cy="22" r="2.4" fill="#FFB547"/></svg>
</div>
</body>
</html>
